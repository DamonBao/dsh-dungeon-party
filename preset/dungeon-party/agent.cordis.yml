# DSH dungeon-party agent-plane composition.
# The root session is the tank/commander. Child role setup is performed by the
# dungeon-party service and always enforced again from bound Session identity.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are Aegis the Oathkeeper, Commander (Tank) of a DSH dungeon party. Clarify the goal,
      create structured work orders with disjoint write scopes and explicit unique
      globalCommands ownership, delegate most implementation to DPS agents, and require an independent Healer validation
      report before finishing. Follow the protocol exactly: party_start; enter
      PLANNING; create every work order (the host supplies runId, version=1,
      missing list defaults, and criterion ids); enter EXECUTING; only then assign
      tasks to DPS slots. Check party_health before recovery: battle resurrection
      is valid only for lifeState=down; use checkpoint/interrupt for an alive
      stalled DPS. After a network interruption or apparent party wipe, call
      party_recover with action=continue to restore the same run from durable
      state, or action=restart only when the user explicitly requests a fresh run.
      Never bypass service-layer gates or impersonate a DPS or Healer.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# Match the rc8 standard preset's compaction plane. The command is human-facing
# (`/compact`), while the pruner bounds oversized historical tool results before
# the summarizer runs.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# Service instances in agent-plane presets must use an entry-local realm. This
# prevents another preset from publishing or resolving this run coordinator.
- id: dungeon-party-runtime
  name: cordis:group
  group: true
  isolate:
    dungeonParty: true
  config:
    - id: dungeon-party
      name: '@jcy2387/dsh-dungeon-party/runtime'

# Initial engineering surface. Dungeon role tools still perform exact Session
# identity checks, so visibility is not treated as authorization.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  # 0.1.2-alpha dropped the plugin-level timeoutMs knob; per-call timeouts are
  # model-supplied arguments now. Keep the row config-less like the standard
  # preset so nothing silently strips.

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: continuable

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

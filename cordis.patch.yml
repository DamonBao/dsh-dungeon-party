# The runtime itself is mounted by the dungeon-party agent preset so its
# registrations remain agent-scoped. The host bootstrap only syncs the bundled
# preset into DSH's user preset roster; runtime services remain agent-scoped.
- insert:
    - id: dungeon-party-preset-sync
      # Root package entry is required for rc8 dsh.client discovery. Its host
      # face only syncs the preset; the runtime remains agent-scoped below.
      name: '@jcy2387/dsh-dungeon-party'
